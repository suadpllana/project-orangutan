# Template for a Project Orangutan task.
#
# Fields map 1:1 onto the authoring form - see docs/form-schema.md for limits.
# Character limits are noted in the comment above each field; the parenthetical
# is what the form's helper text says.
#
# Write these LAST, once the grader exists and the numbers are measurements.
# Then:  python3 tools/validate_task.py tasks/<slug>/task.yaml
#        python3 tools/render_submission.py tasks/<slug>/task.yaml

schema_version: 1

# ----------------------------------------------------------------- identity
title: ""
working_slug: ""               # lowercase-kebab, 3-80 chars, == directory name
collection_family: ""          # dropdown - leave blank, choose in the form
task_family: feature development
verifier_family: programmatic

# --------------------------------------------------------------- what it is
# 40-20,000 chars (what the agent must accomplish)
# Complete enough to work from without the repository. Enumerate the
# requirements, then state the constraints: language/runtime, where files may
# live, what may be imported, what may not be inspected.
objective: |
  TODO

# 20-10,000 chars (why this task matters)
# What capability does a passing score demonstrate? Name the plausible-looking
# wrong version that a shallow understanding produces.
motivation: |
  TODO

# 40-20,000 chars (the runtime, stack, and services)
# Image, pinned packages, the tree the agent starts in, resources, and the
# failure model the spec assumes.
environment_summary: |
  TODO

# ------------------------------------------------------------------ effort
# 40-20,000 chars (why it is hard but solvable)
# Argue both halves. For each requirement, say what forces the real design and
# which shortcut it closes. Then bound the scope so the estimate is credible.
difficulty_explanation: |
  TODO

expert_time_estimate_hours: 4

# ----------------------------------------------------------- oracle & grading
# 20-20,000 chars (how the reference solution solves it)
# The design you actually implemented and ran, with its measured score.
oracle_strategy: |
  TODO

# 40-20,000 chars (how the verifier grades it)
# Collection, integrity checks, how tests are isolated and timed, how results
# are parsed, and the test count per category.
verification_strategy: |
  TODO

# 20-10,000 chars (the pass/fail line)
# Evaluable from report.json alone.
binary_success_condition: |
  TODO

# 20-10,000 chars (how partial credit is assigned)
# Weights table, formula, how timeouts and integrity violations score, and
# predicted scores for the plausible failure modes.
partial_score_strategy: |
  TODO

# 20-20,000 chars (ways an agent might game the grader)
# Every entry names its countermeasure. See docs/exploit-catalog.md.
anticipated_exploits: |
  TODO

# --------------------------------------------------------------- resources
resources:
  cpu_millis: 2000
  memory_mb: 4096
  storage_mb: 8192
  gpu_count: 0
  agent_timeout_s: 14400        # keep >= expert_time_estimate_hours * 3600
  verifier_timeout_s: 1200      # must exceed the sum of per-category timeouts

network:
  mode: none                    # anything else needs a justification below
  justification: ""

# ------------------------------------------------------------------- notes
# Not a form field. Deviations from the defaults, known weaknesses, anything a
# future session would want to know.
notes: |
  TODO

# --------------------------------------------------------------- what it is
objective: |
  `/app` holds `pkgsolve`, the dependency-resolution library behind an internal
  build farm. Its version model, range parser and registry client work. Its
  resolver is a brute-force enumerator: it downloads every release of every
  reachable package, walks the whole cartesian product of assignments, and when
  nothing fits it raises `Unsolvable` with an empty `causes` set.

  Rebuild the resolver so that `pkgsolve` satisfies the specification in
  `instruction.md`. Three requirements have to hold at the same time, and each
  of them rules out the cheap way of getting the others.

  1. **The preference law (§3.2).** There is usually more than one valid
     solution and exactly one of them is correct. `resolve(registry,
     requirements)` must return the one this procedure names: take the packages
     in ascending name order *as they are discovered*, and give each the newest
     release that still leaves the manifest solvable. The decision order is part
     of the answer, not an implementation detail — deciding "the package with
     fewest releases" or "the most constrained package" first, which is the
     standard heuristic and the fast one, returns a perfectly valid solution
     that is the wrong one. A returned solution must also be exactly the
     transitive closure: no missing package and no extra one.

  2. **The explanation law (§4).** When nothing resolves, `Unsolvable.causes`
     must be a `frozenset` of facts that *prove* it. There are two kinds, both
     already defined in the package: `RootRequirement(requirement)` and
     `DependencyFact(package, versions, requirement)` — "every release of
     `package` inside `versions` requires `requirement`". The grader builds the
     reduced universe those facts describe and checks four things: every cited
     root requirement was actually asked for; every cited dependency fact is
     implied by the registry across the whole width of the range it names; the
     reduced universe has no valid solution (sufficiency); and dropping any one
     cited fact makes it satisfiable (minimality). Any set that clears those
     bars is accepted — there is no expected answer to overfit.

  3. **The cost law (§5).** The resolver learns about the universe only by
     calling `registry.versions(package)` and
     `registry.dependencies(package, version)`. The graded suite supplies its
     own registry, counts every call, and gives each instance a budget of at
     least five times what the reference implementation spends there. Budgets
     apply to failing instances too and cover the work of producing `causes`.
     `resolve()` must hold no state between calls, so a cache that outlives a
     call is a test failure rather than an optimisation.

  Also required, and tested: deterministic results that do not depend on
  `PYTHONHASHSEED`; dependency cycles and self-dependencies resolving normally;
  validation (`TypeError` for a non-`Requirement`) before any registry call; an
  empty requirement list returning `{}` with zero calls.

  Python 3.11 standard library only, no network. Every file you add or change
  must live inside `/app/pkgsolve/`; the grader copies `pkgsolve/**/*.py` into a
  tree of its own and discards everything else. The resolver must not read the
  environment, the call stack, function closures or the grader's modules — the
  grader tokenises the submitted source and scores zero if it finds any of it.

motivation: |
  Every package manager has this component and every one of them got it wrong
  before it got it right. npm shipped years of non-deterministic installs; pip's
  resolver rewrite was a multi-year project; Dart's `pub` was rebuilt around
  PubGrub specifically because "could not resolve dependencies" with no
  explanation was the single worst thing about it. The three pressures in this
  task are the three that actually shaped those rewrites: a documented,
  reproducible choice among many valid ones; an error message a human can act
  on; and a bound on how much of a remote index you are allowed to download to
  produce either.

  The registry-call budget is what makes it a real engineering problem rather
  than an algorithms exercise. A resolver's dominant cost is not CPU, it is
  round trips to an index, and the fix is not a faster loop — it is not asking.
  Grading on a counter the submission cannot see reproduces that faithfully and,
  as a side effect, removes wall-clock timing from the score entirely: nothing
  in this task is timed, so the same submission scores the same on a busy
  grading host as on an idle one.

# ------------------------------------------------------------------ effort
difficultyExplanation: |
  The difficulty is not in any one of the three laws. It is that the obvious way
  to satisfy each of them breaks another, and the loop closes.

  **Speed is normally bought with decision order, and that is exactly what is
  forbidden.** The standard way to make dependency resolution tractable is to
  decide the most constrained package first — fewest candidate releases, most
  incoming constraints. §3.2 pins the decision order to alphabetical-as-
  discovered, because that is what makes the result reproducible, so the whole
  usual toolkit is unavailable. A resolver that reorders decisions passes the
  budget category outright and still fails: measured at **0.8724**, because four
  preference tests and three randomised batches name a valid solution that is
  not the specified one. A frontier model that reaches for PubGrub from memory
  lands here.

  **Correctness without pruning blows the budget.** The mirror image: a correct
  alphabetical search with a memoising registry client, no backjumping, no
  memoised dead ends and no derived constraints, scores **0.8857** — it passes
  every other category and misses four of the seven budget instances. Measured
  reference against that resolver, on the same instances: 14 calls against 371,
  33 against 252, 42 against 289, 35 against 384. The gap is not caching; both
  cache. It is that the unpruned search pays for a large irrelevant subtree once
  per candidate release of the package that owns it. Closing it needs three
  distinct mechanisms and each is easy to get subtly wrong:

    * *Conflict-directed backjumping.* A failure has to carry which decisions it
      actually consulted. The trap is under-reporting: a package with no usable
      release looks like it "does not depend on" the decision that pulled it in,
      because no range ever rejected anything. My own reference had exactly that
      bug, reported four instances unsolvable that were not, and it took a
      randomised differential test to find.
    * *Remembering dead sub-problems.* Sound only when the failure consulted no
      decision from outside the sub-problem, which means keeping two different
      conflict sets, not one — ranges inherited from above are part of the
      sub-problem's identity, head-on collisions with a decided version are not.
    * *Deriving a constraint that outlives the path.* When a required package
      fails, the union of what its releases ask of some other package is
      globally valid. Deriving it is the difference between 33 calls and 252 on
      the `late-cap` instance. Deriving it and then *not restarting the pass*
      leaves you at 141 — a real intermediate state of the reference, measured.

  **Minimality cannot be bolted on.** Citing everything the search touched is
  sound and fails (E5). Finding a minimal core by deleting candidate facts and
  re-solving is correct but needs the candidates, and you only have the ones the
  search fetched — which the budget keeps small. So the explanation has to fall
  out of the search's own bookkeeping. Two further traps: a cited range must be
  true across its *whole* width (citing `every a * requires b >=5.0.0` when
  `a 1.0.0` asks for something weaker is rejected), and citing two independent
  reasons for the same failure is sufficient but not minimal.

  **Why this is long-horizon rather than one insight.** None of the three laws
  can be attempted until the others are standing, so the work does not decompose
  into independent sittings; it is a single build that has to be carried a long
  way before any of it can be checked. A realistic ordering, with the time it
  took here:

    * Read the specification and internalise §3.2 — the decision order is a
      procedure, not a preference, and misreading it invalidates everything
      downstream. (~1 h)
    * A complete, correct backtracking search in the fixed order, with lazy
      fetching. Correct and far over budget. (~1.5 h)
    * Conflict-directed backjumping, with the two distinct conflict sets that
      make the dead-end memo sound. This is where the reference had its first
      real bug, and the bug does not show up as slowness — it shows up as
      solvable instances reported unsolvable. (~2.5 h)
    * Derived global constraints, plus the restart that makes them pay. Getting
      the derivation sound (only for unconditionally-required packages, only
      when every usable release has been read) is fiddly. (~2 h)
    * The explanation: recording facts during the search, widening contiguous
      runs, deletion-minimisation, and a satisfiability checker of your own to
      drive it. (~2.5 h)
    * Convincing yourself all three hold at once, which means building the
      differential test the graded suite will run against you. (~2.5 h)

  Those numbers are what it actually took, and two of the bugs above were found
  only by the last step. An agent that writes the search, sees it pass the
  correctness categories and stops has spent perhaps a fifth of the work and
  will score in the eighties.

  **Why it is nevertheless achievable in the estimate.** The domain is small and
  fully specified: three-integer versions, conjunctions of six comparators, two
  registry methods, no pre-releases, no extras, no lock files. The value types,
  the parser, the exception hierarchy and both fact classes are already written
  and are not part of the work. The reference implementation is a single 380-line
  module. An expert who knows what a conflict set is spends the time on the
  interaction, not on the scaffolding — hence 7 hours rather than 20.

expertTimeEstimateHours: 12


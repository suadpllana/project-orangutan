  Base image `python:3.11-slim`, plus `git` and `ca-certificates` from apt and
  `pytest==8.3.3` from pip — all baked in at build time. The rollout has no
  network and the implementation itself must be pure standard library.

  `environment/` becomes `/app` and contains:

    pkgsolve/__init__.py       public exports
    pkgsolve/errors.py         PkgSolveError, InvalidVersion, InvalidRange, Unsolvable
    pkgsolve/versions.py       Version - complete
    pkgsolve/ranges.py         Range - complete
    pkgsolve/requirements.py   Requirement, RootRequirement, DependencyFact - complete
    pkgsolve/registry.py       Registry protocol + InMemoryRegistry - complete
    pkgsolve/solver.py         resolve() - the brute-force enumerator to replace
    public_tests/test_public.py  22 visible tests covering what already works
    SPEC.md                    the normative specification, verbatim
    README.md                  orientation, with the two open issues

  The starting state is working code, not stubs: the enumerator returns the
  correct answer on toy input, which is what makes it a fair starting point and
  a hopeless one. On four chained packages and twenty releases it spends 1,524
  registry calls. The Dockerfile runs a build-time self-check that asserts the
  seed still solves worked example 1, still raises `Unsolvable` with an empty
  `causes`, and still spends more than 800 calls on that manifest, then deletes
  the check; it also `rm -rf`s `/app/tests`, `/app/solution`, `/app/Dockerfile`
  and `/app/task.toml`, runs the visible suite, and makes one git commit so the
  agent can diff its own work.

  Resources: the whole verifier run peaks at **29.6 MB** resident and writes
  nothing to disk beyond the reward files. `taskset` does not exist on the
  authoring host (macOS), so the single-core claim in `task.toml` was checked by
  running the suite under sixteen busy loops on eight cores — roughly a third of
  a core — where the reference still grades in 2.5 s and still scores 1.0000.

  Failure model: there is none to speak of, and that is deliberate. Nothing in
  this task is timed, no process is killed, nothing touches the filesystem or
  the clock. The only cost model is the registry call counter, which is an
  integer the grader owns, so a submission scores identically on a loaded host
  and an idle one.


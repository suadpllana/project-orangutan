# ----------------------------------------------------- oracle & verification
oracleStrategy: |
  `solution/solve.sh` copies `solution/reference/pkgsolve/*.py` over `/app/
  pkgsolve/` and then runs a smoke test that fails loudly if the drop-in is
  broken: it checks the alphabetical decision order on the specification's
  worked example 2, and checks that an unsolvable manifest with sixty
  irrelevant subtrees is explained in under 60 registry calls (the reference
  spends 7).

  Only `solver.py` differs from the starting workspace; the value types, the
  parser and the registry client are shipped unchanged, because they are not
  part of the task. The reference is one 380-line module:

    * **Search.** The §3.2 procedure, literally: the alphabetically first
      undecided needed package, releases newest first, backtracking when a
      choice is not completable. The decision order is never altered.
    * **A memoising client.** One question, one round trip, for the lifetime of
      the call and no longer.
    * **Conflict-directed backjumping.** Every failure carries `blame` — the
      decisions above it that it consulted, including whoever required the
      package in the first place. If the current decision is not blamed, the
      failure is handed straight up and none of that decision's other releases
      is tried.
    * **A dead-sub-problem memo.** Keyed on (undecided packages, ranges on
      them), recorded only when the failure's narrower `external` set is empty —
      i.e. when nothing outside the sub-problem was consulted head-on. This is
      what makes a 25-link chain linear instead of exponential.
    * **Derived global constraints.** When a required package exhausts, the
      union over its usable releases of what each asks of some target confines
      that target for good. Learning one aborts the pass and restarts with a
      warm cache — without the restart the pass keeps grinding through releases
      the new constraint just ruled out, which measured 141 calls instead of 33.
    * **Explanation.** Every dependency list read is recorded as a
      `DependencyFact` about that exact release, so the set of facts on hand at
      failure is a sound proof by construction. It is then widened where a
      contiguous run of releases was read in full (so the message reads "every
      release of x requires y" rather than sixty separate lines) and minimised
      by deletion. Both steps run against the cache and cost zero registry
      calls, which is what keeps them inside the budget.

  Measured through the real `tests/test.sh` entrypoint: **1.0000, PASS, 1.6 s**,
  104/104 tests, and identical under `PYTHONHASHSEED` 0, 1 and 424242.

verificationStrategy: |
  **Visible half** — `environment/public_tests/test_public.py`, 22 tests baked
  into the image, describing only behaviour that already exists: `Version` and
  `Range` parsing and ordering, `Requirement` validation, `InMemoryRegistry`,
  and four small `resolve()` cases including the specification's three worked
  examples. `instruction.md` says in as many words that these are the floor and
  not the target.

  **Hidden half** — everything under `tests/`: 104 tests in eight categories,
  the grader, the exhaustive oracle and the explanation checker. None of it is
  reachable from the image.

  | category | tests | weight | what it grades |
  | --- | --- | --- | --- |
  | `regression` | 22 | 0.00 (multiplier) | the grader's own copy of the visible suite |
  | `api` | 10 | 0.07 | call shape, validation order, closure exactness |
  | `structure` | 10 | 0.06 | cycles, self-edges, repeated edges, disconnected roots |
  | `preference` | 14 | 0.24 | §3.2 — the one solution out of many that is correct |
  | `explanations` | 12 | 0.25 | §4 — (E1) to (E5) on nine failure shapes |
  | `budget` | 7 | 0.20 | §5 — registry calls, on the adversarial shapes |
  | `determinism` | 5 | 0.04 | §6 — repeat calls and three hash seeds |
  | `randomized` | 24 | 0.14 | differential testing against the exhaustive oracle |

  Four things make this measure the objective rather than a proxy.

  **The cost metric is an integer the submission cannot reach.** The registry
  handed to `resolve()` is built per call from closures: it has `__slots__ = ()`,
  no data attributes, and it is not an instance of the submission's own
  `Registry` class, so there is nothing to read and no hook to override. The
  counter lives in a closure cell and is returned to the test, never to the
  resolver. A run that reaches twenty times its budget is aborted with a
  `BaseException` subclass, so a bare `except Exception` cannot convert a blown
  budget into a wrong answer.

  **Explanations are checked structurally, never compared.** The grader
  reconstructs the reduced universe the cited facts describe and checks
  truth (E3), sufficiency (E4) and per-fact minimality (E5) with its own
  complete search. There is no expected `causes` value anywhere in the suite.
  That search was cross-validated against exhaustive enumeration on **20,000**
  randomised reduced universes, including self-dependencies and cycles, and
  agrees on all of them — the first run of that cross-validation found a real
  bug in it.

  **The randomised category has no fixed answers.** Twenty-four seeded batches
  of five instances each generate a small universe and root requirements,
  enumerate every valid solution exhaustively, apply §3.2's procedure to that
  list, and compare. When the oracle finds no solution, the submission must
  raise `Unsolvable` and its explanation must pass (E1)–(E5) against the same
  universe.

  **Every graded universe carries ballast.** A four-package, twenty-release
  satisfiable component that forces genuine backtracking is merged into every
  case, and its packages are named so they sort after anything a test invents
  and can never decide a comparison. Without it the small correctness cases
  would be cheap enough for the starting workspace to pass on cost, which is
  precisely the free credit that keeps a nop run off its floor.

  Anti-gaming structure: the grader copies only `pkgsolve/**/*.py` into a tree
  it owns, drops any `conftest.py` inside the package, runs pytest with
  `--rootdir`, `--confcutdir` and `-p no:cacheprovider`, and uses its own
  pristine copy of the visible suite. It tokenises the collected source and
  refuses submissions that name the test runner, the environment, the call
  stack, function closures, `__dict__`, the garbage collector or the grader's
  own modules. Each category runs as its own process with its own wall-clock
  cap; the run as a whole has a 660 s deadline inside the bundle's 900 s
  verifier timeout inside the draft's 1200 s.

# ------------------------------------------------------------ scoring & exploits
binarySuccessCondition: |
  `tests/test.sh` exits 0, which happens exactly when the weighted score written
  to `/logs/reward.txt` reaches `[verifier] pass_threshold` = **0.92** and no
  integrity violation was found. Equivalently: `resolve()` returns the solution
  §3.2's procedure names on every graded instance, raises `Unsolvable` with a
  true, sufficient and minimal `causes` on every unsolvable one, stays inside
  every registry-call budget, and does not break the visible suite.

partialScoreStrategy: |
  Continuous and monotone. Each category contributes `weight x (tests passed /
  tests collected)`; a category that times out or fails to collect contributes
  its full weight to the denominator and zero to the numerator, so making a
  category unrunnable is never profitable. `regression` has weight 0 and its
  pass ratio multiplies the total instead, so keeping the visible suite green
  earns nothing and breaking it costs proportionally across every other
  category rather than at a cliff. An integrity violation scores 0.0000 outright.

  Weights: api 0.07, structure 0.06, preference 0.24, explanations 0.25,
  budget 0.20, determinism 0.04, randomized 0.14.

  The three laws carry 0.69 between them against a 0.92 threshold, so
  abandoning any one of them fails however good the rest is. That is deliberate
  and it is measured, not assumed — four implementations were graded through the
  real entrypoint:

  | implementation | score | verdict |
  | --- | --- | --- |
  | the reference | **1.0000** | PASS |
  | correct alphabetical search, memoised, no pruning | **0.8857** | FAIL — 3/7 budget |
  | fast search that decides the most-constrained package first | **0.8724** | FAIL — 10/14 preference, 21/24 randomized, 21/22 regression |
  | the untouched starting workspace | **0.0000** | FAIL — every scored category at zero |

  Predicted scores for other partial states, from the same weights: transactions
  of the explanation law alone unbuilt ≈ 0.75; budget law alone unmet ≈ 0.80;
  preference law alone unmet ≈ 0.76. Each is a real, diagnosable state and each
  fails, which is the point of the threshold.

  The nop figure is the result of an audit, not luck. The first measurement put
  the untouched workspace at 0.0200: two determinism tests passed, one because
  an empty `causes` printed identically under three hash seeds and the
  emptiness check was too weak, and one because it only compared the parent's
  and the child's fixture and never called the resolver. Both now fold a
  budgeted solve and an explanation check into the test. Every remaining
  category is zero because every graded instance carries the ballast component,
  which the brute-force enumerator cannot afford.

anticipatedExploits: |
  Ordered by how much of the defence is structural rather than a test somebody
  remembered to write.

  **Reading the universe instead of asking for it.** The obvious way to beat a
  registry-call budget is to get the data another way. The registry object is
  built per call from closures: `__slots__ = ()`, no instance attributes, no
  data on the class, and it is deliberately *not* an instance of the
  submission's own `Registry`, so there is no subclass hook and nothing to read.
  Reaching further — `__closure__`, `cell_contents`, `__globals__`,
  `__subclasses__`, `vars`, `gc.get_objects` — is caught by a tokenised
  integrity scan that zeroes the score, and §2 and §8 of the specification
  forbid it in as many words so a legitimate solution never trips it. Verified
  both ways: a `type(registry).versions.__closure__` cheat is caught, and a
  docstring naming `pytest`, `os.environ`, `sys.modules` and `__closure__` is
  not.

  **Tampering with the grader from inside the package.** `conftest.py`,
  `sitecustomize.py`, `pytest.ini`, edits to `public_tests/`, monkeypatching the
  grader's helpers. The grader copies only `pkgsolve/**/*.py` into a tree it
  owns, drops any `conftest.py` in that copy, runs pytest with `--rootdir`,
  `--confcutdir` and `-p no:cacheprovider`, and grades against its own pristine
  copy of the visible suite. The integrity scan additionally forbids naming
  `_support`, `_oracle`, `sys.modules`, `builtins`, `importlib` and
  `__import__`.

  **Pre-writing the reward.** The agent can write to `/logs`. The grader deletes
  every reward artefact in every candidate directory *before* it publishes its
  own 0.0 floor. Verified: a `reward.txt` containing `1.000000` left behind
  before a nop run is `0.000000` afterwards.

  **Detecting the test run.** `PYTEST_CURRENT_TEST`, `sys.argv`, `os.environ`,
  `inspect.stack`, `sys._getframe`, trace hooks — all in the tokenised scan,
  all forbidden by §8.

  **Returning any valid solution.** The whole preference law exists because
  "satisfies every constraint" is the easy half. Fourteen preference tests name
  the single correct solution, and the randomised category derives it from
  exhaustive enumeration, so there is nothing to hard-code. A resolver that
  returns valid-but-wrong solutions was measured at 0.8724.

  **Buying the budget with a better decision order.** The efficient heuristic is
  forbidden by §3.2 and its use is detected as wrong *answers*, not as a style
  violation. This is the interaction the task is built on.

  **Citing everything, or citing a stronger fact than the registry supports.**
  (E5) rejects any redundant fact, including a second independent reason for the
  same failure; (E3) rejects a cited range that is not true across its whole
  width. Both have dedicated tests with the near-miss spelled out.

  **Passing a negative assertion vacuously.** "No solution was returned" is
  satisfied by a resolver that always raises. Every unsolvable instance is
  paired with solvable ones in the same categories, and `unsolvable_within`
  fails loudly with the returned solution if the instance was in fact solvable.
  Conversely `solve_within` fails if `Unsolvable` escapes.

  **Hard-coding the fixtures.** The randomised category builds its universes
  from seeds at grading time and derives expected answers from an independent
  exhaustive oracle. The constructed instances use generated package names and
  release counts in the tens.

  **Making a category unrunnable, or hanging.** Each category is its own process
  with its own cap; an unrun or timed-out category contributes full weight to
  the denominator and zero to the numerator. A run that reaches twenty times an
  instance's budget is aborted by a `BaseException` subclass the specification
  tells you not to catch. The whole run has a 660 s deadline so a hang still
  produces a report and a reward file.

  **Reward-file games and grader crashes.** A 0.0 floor is written from
  `test.sh` and again from `grade.py` before grading starts, to eight candidate
  directories under both `reward.txt` and `reward.json`; the grading run is
  wrapped in `except BaseException`; the script re-checks afterwards that a
  reward exists. Verified three ways — a normal run writes `1.000000`, an
  exception inside `grade()` writes `0.000000` and reports `FAIL (grader
  error)`, and `SIGKILL` three seconds in leaves `0.000000`.

  **Free credit the starting state was born with** — an authoring bug with the
  same effect as an exploit. Audited by grading the untouched workspace and
  reading every test it passed; see `partialScoreStrategy` for the two that were
  found and closed. It now scores 0.0000.

# ------------------------------------------------------------------- notes
notes: |
  Measured on the authoring host (macOS, 8 cores, CPython 3.9.6 — see the
  caveats below), through the real `tests/test.sh` entrypoint:

    reference            1.0000  PASS   1.6 s   104/104
    no-pruning variant   0.8857  FAIL   4.4 s
    wrong-order variant  0.8724  FAIL
    untouched workspace  0.0000  FAIL   3.1 s
    peak RSS             29.6 MB

  Registry calls, reference vs a correct search with no pruning, on the budget
  instances: 14/371, 33/252, 42/289, 63/570 and 35/384. Budgets are set at
  5.0x-6.7x the reference on every instance.

  **What could not be verified here.**

  * *The image build has not been run.* There is no docker CLI and no daemon on
    this host. `environment/selfcheck.py` — the build-time assertion that the
    seed is still the seed — was run directly instead and passes. Build the
    image once before submitting.
  * *`taskset` does not exist on macOS*, so `cpus = 1` was not proved by pinning
    to one core. It was checked by running the suite under sixteen busy loops on
    eight cores instead: the reference still grades in 2.5 s and still scores
    1.0000. Given a 29.6 MB peak and no I/O, the claim is safe with a wide
    margin, but it is a substitute measurement and not the one asked for.
  * *The suite was executed on CPython 3.9.6*, the only interpreter on this
    host, while the image is `python:3.11-slim`. Everything in the bundle is
    written to run on both — `from __future__ import annotations` throughout, no
    `match`, no `X | Y` at runtime, no 3.10+ stdlib. The repository's own tools
    need 3.11 for `tomllib`; they were run with a local `tomllib` -> `tomli`
    shim on `PYTHONPATH`, which is not part of the bundle.

  **Two real bugs the suite caught**, both in the reference and both after the
  hidden tests were written:

  1. *An unsound backjump.* A failure recorded only the decisions it collided
     with head-on, not the ones that required the failing package in the first
     place. A package with no usable release therefore looked independent of the
     decision that pulled it in, and the search jumped past that decision's
     other releases. It reported four solvable instances as unsolvable and
     produced insufficient explanations for three more. Found by the randomised
     differential category, not by any hand-written test.
  2. *Learning without restarting.* The derived global constraint landed but the
     pass that derived it carried on grinding through the releases the
     constraint had just ruled out. Correct, and 141 registry calls where 33 was
     available — which is the difference between passing and failing the budget
     the test now sets.

  A third bug was in the grader's own satisfiability check (self-dependencies
  were never checked against the version being committed), found by
  cross-validating it against exhaustive enumeration on 20,000 random reduced
  universes. It now agrees on all of them.

  **Design choice worth recording.** §3.2 was originally a declarative
  lexicographic order over solutions, with "installed" ranked above "not
  installed". That order is total and deterministic, but computing the maximum
  under it requires knowing the set of packages that *could* appear, which means
  downloading the reachable universe — the exact thing §5 forbids. The two laws
  were unsatisfiable together. The procedural form in the bundle keeps the
  determinism and the hostility to reordering heuristics, and is computable
  lazily. The seed, the oracle, the reference and every expectation were rebuilt
  against it.

  **Known weaknesses.** Three of the seven budget instances (`wide fanout`,
  `deep chain`, `wide conflict`) separate the reference from a non-caching or
  non-terminating resolver but not from a correct search that merely memoises;
  the other four carry the discrimination. The `explanations` budget of 60 on
  the small shapes is 6.7x the reference rather than 5x, because the reference
  spends only 9 calls there and a tighter number would be measuring noise.

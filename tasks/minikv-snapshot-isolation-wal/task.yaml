notes: |
  * `verifier_timeout_s` is raised from the form default of 1200 s because the
    per-category limits sum above it in the worst case, and a verifier killed by
    the harness reports nothing at all. `grade.py` enforces its own 2100 s
    deadline so it always exits with a report in hand. The reference solution
    grades in about four seconds.
  * `collection_family` is intentionally blank: it is a dropdown in the
    authoring form and the option list is not reproducible from the repository.
  * `network.justification` is empty because the mode is `none`; the field only
    needs filling when access is requested.

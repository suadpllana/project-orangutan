[metadata]
name = "minikv-snapshot-isolation-wal"
title = "minikv: snapshot-isolated transactions over a crash-safe write-ahead log"
description = """
Rebuild the storage engine of a small embedded key/value store: snapshot-isolated
transactions with first-committer-wins conflict detection, an append-only
write-ahead log that survives SIGKILL, recovery that degrades to a prefix of the
commit history when the log is damaged, and a crash-safe checkpoint that actually
reclaims space -- all under a throughput budget that rules out rewriting the
database on every write. Correct values are not enough: the grader kills the
process mid-flight, damages the log at sixteen offsets, and forces the MVCC
design with a single-threaded test that deadlocks any lock-based fake.
"""
tags = ["library-clone", "storage", "transactions", "crash-recovery", "python"]
collection_family = "library_clone"
task_family = "feature_development"
verifier_family = "programmatic"
difficulty = "hard"
expert_time_estimate_hours = 4
version = "1.0.0"

[agent]
# The rollout is fully sealed: everything the task needs is baked into the image.
network_mode = "none"
# Deliberately below the draft's 36000s (10h) envelope; the bundle must never ask
# for more than the draft declares. 36000 is NOT the form default: 14400 was
# rejected at Difficulty evaluation as "Too short for the collection - not
# long-horizon", so the draft must be raised in the form and the raise confirmed
# saved before this bundle is uploaded. Nor is 43200 available -- the form
# refuses anything above 37000s, because build, verify and teardown come out of
# the same 14h per-trial wall clock. 10h is the top of the band, not a
# compromise.
timeout_sec = 34800

[verifier]
entrypoint = "tests/test.sh"
network_mode = "none"
# The suite takes ~5s against the reference and ~240s against the untouched
# starting state -- the slowest thing that still finishes. 600s sits well below
# the draft's 1200s envelope, and grade.py holds its own 480s deadline inside it.
timeout_sec = 600
# Continuous, weighted score in [0, 1]; written to /logs/reward.txt and
# /logs/score.json. Exit status 0 means the score reached the threshold.
reward_file = "/logs/reward.txt"
pass_threshold = 0.85

[environment]
dockerfile = "environment/Dockerfile"
build_context = "environment"
# Strictly below the draft's resourceEstimate (2000 cpuMillis / 4096 MB /
# 8192 MB), on the same principle as the timeouts above. Three uploads whose
# resources exactly EQUALLED the draft were all rejected as a "resource
# declaration mismatch" while every other field varied between them, so equality
# is the one thing left that they had in common.
#
# `gpus` is the exception and must stay 0: it cannot be lower, so a rule that
# demanded strictly-less everywhere would make every CPU-only task impossible.
#
# These are also honest figures. The heaviest graded workload is 20k keys of
# ~112 bytes, peaking in the low tens of megabytes, and the reference grades the
# whole suite in ~5s. Verified under `taskset -c 0`, i.e. on a single core.
cpus = 1
memory_mb = 2048
storage_mb = 4096
gpus = 0
